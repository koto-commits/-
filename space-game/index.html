<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Star Dodger</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05060f;
      color: #fff;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow: hidden;
      /* スマホで長押ししたときの選択やズームを防ぐ */
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* ゲーム画面全体（中央寄せ） */
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* キャンバスの大きさは game.js で画面に合わせて決める */
    canvas {
      display: block;
      background: #05060f;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(80, 120, 255, 0.15);
    }

    /* スタート画面・ゲームオーバー画面（キャンバスの上に重ねる） */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 16px;
      background: rgba(5, 6, 15, 0.55); /* 後ろの隕石で文字が読みにくくならないように暗くする */
    }
    .hidden { display: none; }

    h1 {
      margin: 0;
      font-size: 40px;
      letter-spacing: 2px;
      color: #ffe27a;
      text-shadow: 0 0 16px rgba(255, 226, 122, 0.6);
    }
    .overlay p { margin: 0; color: #c8d0ff; line-height: 1.6; }
    .big { font-size: 28px; color: #fff; }

    .btn {
      margin-top: 8px;
      padding: 14px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #05060f;
      background: #ffe27a;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    .btn:hover { background: #fff0b0; }

    /* 右上のBGMボタン */
    #bgmBtn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      padding: 8px 14px;
      font-size: 14px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <!-- BGMのON/OFFボタン -->
    <button id="bgmBtn">♪ BGM: ON</button>

    <!-- スタート画面 -->
    <div id="startScreen" class="overlay">
      <h1>STAR DODGER</h1>
      <p>隕石をよけて、星を集めよう！</p>
      <p>隕石の<b>すれすれ</b>をよけるとボーナス！<br>星を続けて取るとスコア倍率アップ</p>
      <p>PC：← → キー ／ スマホ：指で左右にドラッグ</p>
      <button id="startBtn" class="btn">スタート</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="overScreen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p class="big">スコア：<span id="finalScore">0</span></p>
      <p>ハイスコア：<span id="bestScore">0</span></p>
      <button id="retryBtn" class="btn">リトライ</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
